[package]
name = "cosmosis"
description = "Cosmósis: the project folder layout and the cosmosis.noll manifest"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
# One test binary for the files in tests/ (Sau task 0-26, S69): tests/main.rs.
autotests = false

[dependencies]
# Null's parser, by path (Sau's boundaries: Cosmósis depends on Null). MIT.
null_syntax = { path = "../../../Null/compiler/null_syntax" }
# Null's checker, by path, against the schema Sau generates (task 1a-15). MIT.
null_check = { path = "../../../Null/compiler/null_check" }
sha2 = "0.10"

[lints]
workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
