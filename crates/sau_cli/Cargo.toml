[package]
name = "sau_cli"
description = "The sau command"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
# One test binary for the files in tests/ (Sau task 0-26, S69): tests/main.rs.
autotests = false

[[bin]]
name = "sau"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
cosmosis = { path = "../cosmosis" }
null_syntax = { path = "../../../Null/compiler/null_syntax" }
# Null's canonical printer, for `sau fmt` (Sau task C-07). MIT.
null_print = { path = "../../../Null/compiler/null_print" }

[[test]]
name = "main"
path = "tests/main.rs"
