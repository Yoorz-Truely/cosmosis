[package]
name = "sau_cli"
description = "The sau command"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "sau"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
cosmosis = { path = "../cosmosis" }
null_syntax = { path = "../../../Null/compiler/null_syntax" }
# Null's canonical printer, for `sau fmt` (Sau task C-07). MIT.
null_print = { path = "../../../Null/compiler/null_print" }

[dev-dependencies]
# Null's checker, for expanding the corpus's components in the v0 corpus test (Sau task 1d-08a).
# MIT.
null_check = { path = "../../../Null/compiler/null_check" }
